# Deploy de referência no Kubernetes. Antes de aplicar, publique as imagens:
#   docker build -t <registry>/nexus-backend:1.0.0 backend && docker push <registry>/nexus-backend:1.0.0
#   docker build -t <registry>/nexus-frontend:1.0.0 frontend && docker push <registry>/nexus-frontend:1.0.0
# e troque <registry> abaixo. Depois:
#   kubectl apply -f k8s/nexus.yaml
#   kubectl -n nexus port-forward svc/frontend 8080:80
apiVersion: v1
kind: Namespace
metadata:
  name: nexus
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus
type: Opaque
stringData:
  POSTGRES_PASSWORD: troque_esta_senha
  DATABASE_URL: postgresql+psycopg://nexus:troque_esta_senha@postgres:5432/nexus
  OPENAI_API_KEY: ""
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nexus
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: nexus }
            - { name: POSTGRES_USER, value: nexus }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: nexus-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: nexus }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: nexus }
spec:
  # 1 réplica enquanto SEED_DEMO=true (a carga de demonstração roda na inicialização).
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: backend
          image: <registry>/nexus-backend:1.0.0
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: nexus-secrets, key: DATABASE_URL } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: nexus-secrets, key: OPENAI_API_KEY } }
            - { name: SEED_DEMO, value: "true" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: nexus }
spec:
  selector: { app: backend }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: nexus }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: <registry>/nexus-frontend:1.0.0
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: nexus }
spec:
  selector: { app: frontend }
  ports: [{ port: 80 }]
